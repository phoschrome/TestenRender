name: Backend CI and Render deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend-productos/**'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend-productos/**'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-productos
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend-productos/.node-version
          cache: npm
          cache-dependency-path: backend-productos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime versions
        run: |
          node --version
          node -e "const expressVersion = require('express/package.json').version; if (expressVersion !== '4.22.3') process.exit(1); console.log('Express ' + expressVersion)"

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Run API tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_URL GitHub secret before enabling Render deployments."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
