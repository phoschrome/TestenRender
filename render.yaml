services:
  - type: web
    name: testenrender-api
    runtime: node
    rootDir: backend-productos
    plan: free
    buildCommand: npm ci && npm run prisma:generate
    startCommand: npm start
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 26.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
